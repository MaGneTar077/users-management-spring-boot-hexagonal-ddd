# =============================================
# Test configuration (fictitious values only)
# =============================================

# Evita levantar contexto web en tests Mockito puros (@ExtendWith(MockitoExtension.class))
spring.main.web-application-type=none
spring.autoconfigure.exclude[0]=org.springframework.boot.autoconfigure.security.servlet.UserDetailsServiceAutoConfiguration

db.host=localhost
db.port=3306
db.name=test_db
db.username=test_user
db.password=test_pass

# =============================================
# SMTP test configuration
# =============================================
smtp.host=smtp.test.local
smtp.port=587
smtp.username=test@test.local
smtp.password=test_smtp_pass
smtp.from.address=test@test.local
smtp.from.name=Test User

jwt.secret=dGVzdC1vbmx5LWp3dC1zZWNyZXQtd2l0aC1hdC1sZWFzdC0zMi1ieXRlcw==
jwt.expiration-seconds=900

# =============================================
# Kafka - valores ficticios para tests (no se conecta a Aiven)
# =============================================
kafka.bootstrap-servers=localhost:9092
kafka.security-protocol=SASL_SSL
kafka.sasl-mechanism=PLAIN
kafka.username=test-user
kafka.password=test-password
kafka.ssl-ca-pem=-----BEGIN CERTIFICATE-----MIIBtest-----END CERTIFICATE-----
kafka.group-id=test-group
kafka.topics.user-created=test.users.created
kafka.topics.user-updated=test.users.updated
kafka.topics.user-deleted=test.users.deleted
