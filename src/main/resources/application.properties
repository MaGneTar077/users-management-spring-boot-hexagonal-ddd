# =============================================
# Spring Boot
# =============================================
spring.application.name=users-management
server.port=${PORT:8080}

# DataSource y JavaMail se configuran manualmente con @Configuration
spring.autoconfigure.exclude[0]=org.springframework.boot.autoconfigure.jdbc.DataSourceAutoConfiguration
spring.autoconfigure.exclude[1]=org.springframework.boot.autoconfigure.mail.MailSenderAutoConfiguration

# =============================================
# Configuracion de Base de Datos PostgreSQL
# =============================================
db.host=${DB_HOST:dpg-dabi207qj5pc73a3bnhg-a.virginia-postgres.render.com}
db.port=${DB_PORT:5432}
db.name=${DB_NAME:crud_usuarios_uan9}
db.username=${DB_USERNAME:users_admin}
db.password=${DB_PASSWORD:}
db.sslmode=${DB_SSL_MODE:disable}

# =============================================
# Configuracion SMTP (JavaMail)
# =============================================
smtp.host=${SMTP_HOST:smtp.gmail.com}
smtp.port=${SMTP_PORT:587}
smtp.username=${SMTP_USERNAME:}
smtp.password=${SMTP_PASSWORD:}
smtp.from.address=${SMTP_FROM_ADDRESS:}
smtp.from.name=${SMTP_FROM_NAME:Gestion de Usuarios}

logging.level.root=INFO
logging.level.org.springframework=INFO
logging.level.com.zaxxer.hikari=INFO