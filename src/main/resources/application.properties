# =============================================
# Spring Boot
# =============================================
spring.application.name=users-management
server.port=${PORT:8080}

# DataSource y JavaMail se configuran manualmente con @Configuration
spring.autoconfigure.exclude[0]=org.springframework.boot.autoconfigure.jdbc.DataSourceAutoConfiguration
spring.autoconfigure.exclude[1]=org.springframework.boot.autoconfigure.mail.MailSenderAutoConfiguration
spring.autoconfigure.exclude[2]=org.springframework.boot.autoconfigure.security.servlet.UserDetailsServiceAutoConfiguration

# =============================================
# Configuracion de Base de Datos PostgreSQL
# =============================================
db.host=${DB_HOST:dpg-dabi207qj5pc73a3bnhg-a.virginia-postgres.render.com}
db.port=${DB_PORT:5432}
db.name=${DB_NAME:crud_usuarios_uan9}
db.username=${DB_USERNAME:users_admin}
db.password=${DB_PASSWORD:}
db.ssl-mode=${DB_SSL_MODE:require}

# =============================================
# Configuracion SMTP (JavaMail)
# En produccion (Render) se desactiva dejando SMTP_HOST vacio
# porque el envio de correos lo hace el microservicio "notificaciones" via Kafka.
# En local, define SMTP_HOST en el .env si quieres probar el envio directo.
# =============================================
smtp.host=${SMTP_HOST:smtp.gmail.com}
smtp.port=${SMTP_PORT:587}
smtp.username=${SMTP_USERNAME:}
smtp.password=${SMTP_PASSWORD:}
smtp.from.address=${SMTP_FROM_ADDRESS:}
smtp.from.name=${SMTP_FROM_NAME:Gestion de Usuarios}

# =============================================
# Seguridad JWT
# En produccion defina JWT_SECRET con al menos 32 bytes aleatorios codificados en Base64.
# =============================================
jwt.secret=${JWT_SECRET:ZGV2ZWxvcG1lbnQtb25seS1qd3Qtc2VjcmV0LW11c3QtYmUtcmVwbGFjZWQ=}
jwt.expiration-seconds=${JWT_EXPIRATION_SECONDS:900}

logging.level.root=INFO
logging.level.org.springframework=INFO
logging.level.com.zaxxer.hikari=INFO

# =============================================
# Apache Kafka (Aiven) - publicacion de eventos de dominio
#
# El certificado CA se lee desde un ARCHIVO (no desde una variable de entorno con
# el PEM completo): Render no preserva los saltos de linea en los secret de texto,
# lo que produce el error "No matching CERTIFICATE entries in PEM file".
#
# En local, apunta KAFKA_SSL_CA_LOCATION al archivo:
#   PowerShell: $env:KAFKA_SSL_CA_LOCATION = "./ca.pem"
#
# En Render, crea un Secret File llamado "ca.pem" (Render lo monta en /etc/secrets/ca.pem)
# y define KAFKA_SSL_CA_LOCATION=/etc/secrets/ca.pem
# =============================================
kafka.ssl-ca-location=${KAFKA_SSL_CA_LOCATION:}

spring.kafka.bootstrap-servers=${KAFKA_BOOTSTRAP_SERVERS}
spring.kafka.properties.security.protocol=${KAFKA_SECURITY_PROTOCOL:SASL_SSL}
spring.kafka.properties.sasl.mechanism=${KAFKA_SASL_MECHANISM:PLAIN}
spring.kafka.properties.sasl.jaas.config=org.apache.kafka.common.security.plain.PlainLoginModule required username="${KAFKA_USERNAME}" password="${KAFKA_PASSWORD}";
spring.kafka.ssl.trust-store-location=file:${KAFKA_SSL_CA_LOCATION:}
spring.kafka.ssl.trust-store-type=PEM
spring.kafka.producer.key-serializer=org.apache.kafka.common.serialization.StringSerializer
spring.kafka.producer.value-serializer=org.apache.kafka.common.serialization.StringSerializer
spring.kafka.producer.acks=all
spring.kafka.producer.retries=3
spring.kafka.producer.properties.enable.idempotence=true

kafka.bootstrap-servers=${KAFKA_BOOTSTRAP_SERVERS}
kafka.security-protocol=${KAFKA_SECURITY_PROTOCOL:SASL_SSL}
kafka.sasl-mechanism=${KAFKA_SASL_MECHANISM:PLAIN}
kafka.username=${KAFKA_USERNAME}
kafka.password=${KAFKA_PASSWORD}
kafka.group-id=${KAFKA_GROUP_ID:users-management-group}
kafka.topics.user-created=${KAFKA_TOPIC_USER_CREATED:users.created}
kafka.topics.user-updated=${KAFKA_TOPIC_USER_UPDATED:users.updated}
kafka.topics.user-deleted=${KAFKA_TOPIC_USER_DELETED:users.deleted}